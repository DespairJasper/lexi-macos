[package]
name = "fsrs-optimizer"
version = "0.2.0"
edition = "2021"
authors = ["Lexi Team"]
license = "MIT OR Apache-2.0"
description = "Standalone FSRS-6 personal parameter training helper for Lexi"

[dependencies]
fsrs = { path = "vendor/fsrs", version = "5.2.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
